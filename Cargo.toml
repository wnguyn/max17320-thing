[package]
name = "firmblop"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", features = ["stm32h735vg", "memory-x"] }
usb-device = "0.3"
usbd-serial = "0.2"
embedded-hal = "1"
embedded-hal-nb = "1"
nb = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
